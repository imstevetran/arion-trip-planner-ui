name: Build and deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Public — no secret here, this is just where the API lives.
      VITE_TRIP_PLANNER_API_URL: https://arion-trip-planner-api.stevetran-dev.workers.dev
      # Not a real secret (Vite inlines it into the public bundle — see
      # src/lib/api.ts), but stored as a repo secret anyway rather than
      # committed in plaintext, since it must exactly match
      # trip-planner-api's FRONTEND_API_SECRET.
      VITE_TRIP_PLANNER_API_SECRET: ${{ secrets.VITE_TRIP_PLANNER_API_SECRET }}
      # Also not a real secret (see src/lib/streetImagery.ts) — same
      # reasoning as VITE_TRIP_PLANNER_API_SECRET above, stored as a repo
      # secret rather than committed in plaintext.
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx oxlint
      # tsc -b (type check) + vite build, see package.json.
      - run: npm run build
      - run: npx wrangler pages deploy dist --project-name arion-trip-planner-ui --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
